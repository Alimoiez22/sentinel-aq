[project]
name = "sentinel-aq"
version = "0.1.0"
description = "Correctness-verified recovery for an incremental air-quality pipeline (OpenAQ, Lahore)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Ranges here; exact versions live in uv.lock (rule 5: pin in lockfiles).
dependencies = [
    "psycopg[binary]>=3.3,<3.4",
    "polars>=2.1,<3",
    "pyarrow>=26,<27",
    "pandera[polars]>=0.35,<0.36",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6.0,<7",
    "structlog>=26.1,<27",
    "tzdata>=2026.6",
    "dbt-core>=1.12,<1.13",
    "dbt-postgres>=1.11,<1.12",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "hypothesis>=6.170,<7",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, S: security,
# SIM: simplifications, RUF: ruff-specific checks.
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest works.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the PostgreSQL service from docker compose",
    "network: talks to the real OpenAQ bucket; excluded from make test and CI",
]
