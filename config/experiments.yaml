# Track A design (PROJECT_BRIEF §13). `make experiment` runs every fault x automated
# mode x seed. Manual-mode trials need a human operator: `make manual-trial` (RUNBOOK).
version: 1
dataset: synthetic            # synthetic fixtures (data/fixtures/synthetic); 'real' after M1
faults: [F0, F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, F11, F12, F13, F14, F15]
modes: [retries_only, guarded]
# Evaluation seeds are HELD OUT: seeds 1-3 were used while developing and debugging
# classifier clf-1 (frozen 2026-11-11). Each seed changes the target location-day and the
# fault's parameters, so evaluation trials are variants the classifier was not tuned on.
development_seeds: [1, 2, 3]
seeds: [11, 12, 13, 14, 15]
# Simulated processing time of scheduled run 0; run 1 is one day later. Chosen so the
# newest fixture day (2025-11-03) is inside its 96 h grace window at run 0.
run0_utc: "2025-11-07T00:00:00+00:00"
# Policy backoffs are multiplied by this factor in experiments, so a trial does not sleep
# for real seconds. Recorded in metadata.json.
backoff_scale: 0.0
