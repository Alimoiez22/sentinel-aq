# Scope of the study. Validated by src/sentinel/config.py (pydantic); unknown keys fail.
version: 1

country_iso: PK

# Reference point for "distance to Lahore", used only to rank candidate locations.
# Approximate city centre (WGS 84), not a measurement site.
lahore:
  latitude: 31.5204
  longitude: 74.3587
  radius_km: 25

# Source dates (local calendar days of each location). end: null means "today minus
# 4 days", because files are written about 72 h after the local day ends (RESEARCH §5).
date_range:
  start: 2019-05-01   # all history of the reference monitor 8664 (from 2019-05-23)
  end: null

# Both chosen locations measure PM2.5 only (config/locations_lahore.csv), so PM10 is out of
# scope: gating it would mark every day "partial: 0 hours" (2026-11-17).
parameters: [pm25]

# Chosen study locations (OpenAQ location ids), from results/m1_coverage_summary.md
# (2026-11-17): 8664 = US Diplomatic Post Lahore, reference grade, 2019-05-23..2025-03-04;
# 4568423 = Model Town, AirGradient low-cost sensor, from 2025-05-30. Found on the public
# OpenAQ Explorer (config/locations_lahore.csv) because no working API key was available.
# Proposed by Claude; the author confirms or changes the choice.
locations: [8664, 4568423]

# Locations recorded by the daily snapshot (Track B).
snapshot_locations: [8664, 4568423]
